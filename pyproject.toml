[project]
urls = { repository = "https://github.com/rookes/cantocaptions-ai" }
authors = [{ name = "Jon Miller" }]
name = "cantocaptions-ai"
version = "0.8.0"
description = "End-to-end pipeline for high-quality, time-accurate written Cantonese subtitles."
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = "BSD-2-Clause"

dependencies = [
    # 5.13 is where Qwen3-ASR, the default model family, is native (AutoModelForMultimodalLM).
    "transformers>=5.13.0",
    "accelerate>=1.0.0",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pyannote-audio>=4.0.0",
    # >=0.36.2 because from there huggingface_hub depends on hf-xet unconditionally
    # (gated on CPU architecture, not on an extra), so every install gets Xet-backed
    # downloads with no opt-in. See the "Faster downloads" note in the README.
    "huggingface-hub>=0.36.2",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "opencc>=1.0.0",
    "nltk>=3.9.1",
    "tqdm>=4.0",
    "omegaconf>=2.3.0",
    "einops>=0.6.0",
    "beartype>=0.16.0",
    "rotary-embedding-torch>=0.6.0",
    "librosa>=0.10.0",
    "pycantonese>=3.4.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
ensemble = ["faster-whisper>=1.0.0"]
llm = ["bitsandbytes>=0.43.0"]
# Triton, which backs torch.compile on CUDA: --compile, and --vocal_isolation_compile
# (which falls back to running uncompiled without it). Linux's CUDA torch already pulls
# Triton in; Windows needs this extra. Every ASR family, Qwen3-ASR included, runs on the
# base install.
compile = [
    "triton; sys_platform == 'linux'",
    "triton-windows<3.7; sys_platform == 'win32'",
]
# The extra's former name, from when Qwen3-ASR needed a newer transformers than the base
# install; kept so existing `--extra transformers_qwen` commands still work.
transformers_qwen = [
    "triton; sys_platform == 'linux'",
    "triton-windows<3.7; sys_platform == 'win32'",
]
flash-attn = [
    "flash-attn>=2.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# The SDKs for the LLM proofreading stage (--proofread). Installing them turns nothing on:
# the stage stays off, and the pipeline offline, until it is enabled per run or in user.cfg.
proofread = ["google-genai>=2.0", "anthropic>=1.0"]
# Every optional extra.
full = [
    "faster-whisper>=1.0.0",
    "bitsandbytes>=0.43.0",
    "triton; sys_platform == 'linux'",
    "triton-windows<3.7; sys_platform == 'win32'",
    "flash-attn>=2.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "google-genai>=2.0",
    "anthropic>=1.0",
]

[project.scripts]
cantocaptions = "cantocaptions_ai.__main__:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = ["cantocaptions_ai*"] } }

[tool.setuptools.package-data]
cantocaptions_ai = ["languages/yue/opencc/*", "languages/yue/rules/*.toml", "assets/*", "pipeline/align_substitutions/*.toml", "presets/*.cfg", "languages/yue/proofread/*.md", "pipeline/proofread/*.md"]

# torchcodec (transitive dep of pyannote-audio >=4) has no wheels for Windows, macOS, or Linux aarch64.
# Only Linux x86_64 has torchcodec wheels; everywhere else we override it away.
[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin'",
]
override-dependencies = [
    "torchcodec>=0.6.0; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'AMD64' and platform_machine != 'x86_64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
  { index = "pytorch", marker = "platform_machine == 'AMD64' and sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cpu", marker = "platform_machine != 'AMD64' and platform_machine != 'x86_64' and sys_platform != 'darwin'" },
  { index = "pytorch", marker = "platform_machine == 'x86_64' and sys_platform == 'linux'" },
  { index = "pytorch", marker = "platform_machine == 'AMD64' and sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "subtitle-edit-rate>=0.4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: needs ffmpeg/ffprobe on PATH",
    "slow: takes more than a few seconds",
]
