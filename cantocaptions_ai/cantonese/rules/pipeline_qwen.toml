# Cleaning step sequence for vanilla Qwen3-ASR output, applied in order to each line.
#
# Selected by the model profile's `cleaning` field (model_profiles._QWEN_CLEANING),
# NOT by being named `pipeline.toml` -- that name now holds the lighter default
# manifest a fine-tuned model gets. This is the full legacy chain: Qwen writes
# Mandarin-flavoured, Simplified-derived text with generic particles, so it needs the
# question-particle, ASR-error, numeral and particle-convention steps on top of the
# character/punctuation/noise work the default already does.
#
#   type = "rules"    applies the ordered regex rules in `file` (same directory)
#   type = "builtin"  runs a coded step from SubtitleCleaner.BUILTIN_STEPS:
#                     acronyms, question_particles, chinese_numbers, linebreak, trim
#
# This order mirrors the legacy canto_subtitle_cleaner clean_subtitle() chain and
# is load-bearing: rules assume the transformations of every step before them.

[[steps]]
type = "builtin"
name = "acronyms"

[[steps]]
type = "rules"
file = "punctuation.toml"

[[steps]]
type = "rules"
file = "chars_hk.toml"

[[steps]]
type = "builtin"
name = "question_particles"

[[steps]]
type = "rules"
file = "question_post.toml"

[[steps]]
type = "rules"
file = "comma_conjunctions.toml"

[[steps]]
type = "rules"
file = "misc_conventions.toml"

[[steps]]
type = "rules"
file = "asr_errors.toml"

[[steps]]
type = "builtin"
name = "chinese_numbers"

[[steps]]
type = "rules"
file = "particle_conventions.toml"

[[steps]]
type = "rules"
file = "interjection_noise.toml"

[[steps]]
type = "rules"
file = "repeated_speech.toml"

[[steps]]
type = "builtin"
name = "linebreak"

[[steps]]
type = "builtin"
name = "trim"
