# Comma insertion around conjunctions (legacy clean_subtitle_misc)
# Rules are applied in order, top to bottom, one re.sub pass each.
# Patterns/replacements use TOML literal (single-quoted) strings: backslashes are verbatim.
#
# Both manifests also run this file as a `pre_align` step, on the raw ASR text before
# alignment, so the commas it inserts become clause boundaries a cue can end or start
# on. That text has not been through punctuation.toml yet, so every lookaround also
# accepts the half-width marks (, ? !) the model may still be writing. The file runs
# again during cleaning, where the lookbehinds make it a no-op on commas already there.

[[rules]]
pattern = '(?<![？！，…,?!之])(?<!^)但係(?![，！？,!?])'
replace = '，但係'

# Commenting out - usage of 不過 like 只不過 is possible.
# [[rules]]
# pattern = '(?<![？！，])(?<!^)(?<![之只])不過(?![，！？])'
# replace = '，不過'

# A pronoun subject reads straight into its 雖然 ("我雖然…", "佢哋雖然…"), so it takes
# no comma; 哋 covers every plural (我哋, 你哋, 佢哋, 人哋).
[[rules]]
pattern = '(?<![？！，…,?!我你佢哋])(?<!^)雖然(?![，！？,!?])'
replace = '，雖然'

[[rules]]
pattern = '(?<![？！，…,?!哋咁噉你佢我])(?<!^)首先(?![，！？,!?])'
replace = '，首先'

# Not at the end of a line: there the line break already does the comma's job, and a
# trailing one is exactly the stray comma this would otherwise leave on a cue.
[[rules]]
pattern = '嘅話(?![…，！？呢,!?]|$)'
replace = '嘅話，'
