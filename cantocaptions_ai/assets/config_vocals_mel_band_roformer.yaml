model:
  dim: 384
  depth: 6
  stereo: true
  num_stems: 1
  time_transformer_depth: 1
  freq_transformer_depth: 1
  num_bands: 60
  dim_head: 64
  heads: 8
  attn_dropout: 0
  ff_dropout: 0
  flash_attn: True
  dim_freqs_in: 1025
  sample_rate: 44100
  stft_n_fft: 2048
  stft_hop_length: 441
  stft_win_length: 2048
  stft_normalized: False
  mask_estimator_depth: 2
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes:
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: False

training:
  instruments:
  - vocals
  - other
  target_instrument: vocals

inference:
  num_overlap: 2
  chunk_size: 352800
  # "chunked" slides a fixed chunk_size window at num_overlap and stitches with
  # overlap-add; "whole" runs one forward pass per segment at its natural length.
  # chunk_size is an inference-harness choice, not a model constraint -- the model
  # is a transformer over STFT frames and takes any length -- and whole is ~2.5x
  # faster with no seams, so it looks like the obvious default. It is not.
  #
  # Measured end-to-end on the 825-row dev split with the merged LoRA-r128 model,
  # CER: chunked 0.1615, raw (no isolation) 0.1632, whole 0.1695. Whole costs
  # +0.0080 CER against chunked (95% CI [-0.0016, +0.0185]; +0.0104, CI excluding
  # zero, on a 300-row subsample) -- ~5% relative, consistently in that direction.
  # The divergence does not grow with segment length, so this is not rotary
  # extrapolation: it is the loss of overlap-add averaging, which acts as
  # test-time ensembling and is apparently worth more than the speed.
  #
  # Keep "whole" for throughput-bound bulk jobs where a few percent CER is an
  # acceptable trade. It must match what the downstream ASR model was trained on.
  mode: chunked
  # Reflect padding added to each end before separation and cut off after, giving
  # the model context past the segment edge. Chunked mode ignores this and pins the
  # border to chunk_size - step, which the overlap-add ramp requires.
  border_s: 1.0
  # Above this, a segment falls back to the chunked path. VAD bounds segments to
  # --chunk_size (30 s default) but nothing structurally guarantees it, and peak
  # VRAM grows with segment length (3.9 GB at 30 s, fp32).
  whole_max_s: 35.0
