# Default cleaning step sequence, applied in order to each subtitle line.
#
#   type = "rules"    applies the ordered regex rules in `file` (same directory)
#   type = "builtin"  runs a coded step from SubtitleCleaner.BUILTIN_STEPS:
#                     acronyms, question_particles, chinese_numbers, linebreak, trim
#
# This is what a model gets when its profile names no other manifest -- the right
# starting point for a checkpoint fine-tuned to emit the target convention, which
# already writes the particles, question forms and numerals the heavier steps exist
# to impose. It keeps only the work that is about *presentation* rather than about
# correcting a model's dialect: character variants, punctuation, and noise.
#
# Vanilla Qwen3-ASR needs the full legacy chain instead; see pipeline_qwen.toml,
# selected via the model profile's `cleaning` field.
#
# The order below is the relative order these same steps hold in pipeline_qwen.toml,
# and is load-bearing for the same reason: chinese_numbers has to follow
# punctuation.toml because it groups values >= 10,000 with *half-width* commas (45,010)
# and punctuation.toml rewrites ',' -> '，'. Nothing after it here touches a half-width
# comma, which is what lets that grouping reach the subtitle.
#
# comma_conjunctions.toml is left out, both here and as a `pre_align` step: a
# fine-tuned checkpoint punctuates its own clauses, so the commas it wrote (or didn't)
# around 嘅話/雖然/但係/首先 stand. With no `pre_align` steps, alignment sees the ASR
# text exactly as the model wrote it.
#
# Repeats are handled by repeated_speech_strict.toml, not the Qwen chain's
# repeated_speech.toml: a fine-tuned checkpoint writes "X，X" for an utterance said twice
# and "X，X…" for more than twice, so only X three or more times and the "X，X…" form
# are reduced (both to "X…").
#
# linebreak and trim are layout, not dialect correction, so they close this chain
# exactly as they close the Qwen one: without them a long cue went out as a single
# over-width line, and a comma left on the end of a cue was never stripped.

[[steps]]
type = "rules"
file = "punctuation.toml"

[[steps]]
type = "rules"
file = "chars_hk.toml"

[[steps]]
type = "builtin"
name = "chinese_numbers"

[[steps]]
type = "rules"
file = "interjection_noise.toml"

[[steps]]
type = "rules"
file = "repeated_speech_strict.toml"

[[steps]]
type = "builtin"
name = "linebreak"

[[steps]]
type = "builtin"
name = "trim"
