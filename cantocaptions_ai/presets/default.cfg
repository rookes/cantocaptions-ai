# cantocaptions-ai — default configuration
#
# Every value here is also a --flag, and the command line always wins. Precedence is:
#     built-in defaults  ->  THIS FILE (or --cfg NAME)  ->  user.cfg
#     ->  --vocal_isolation/--asr/--align presets  ->  flags you type
#
# This file ships with the package and documents the defaults. To make a setting stick
# for yourself, put it in user.cfg in your config directory instead: ./config, the
# checkout's config/, $CANTOCAPTIONS_CONFIG_DIR, or ~/.config/cantocaptions-ai. Same
# format, holding only the keys you want to change. A default.cfg of your own in that
# directory replaces this file.
#
# Settings are grouped by section, the same groups as `--help`. A [pipeline] block may
# hold any of them instead (the older, flat form); a setting placed in the wrong section
# is an error that names the right one.
#
# Values must match the flag's own type; `None` means "unset". Anything after a #
# is a comment. Run `uv run cantocaptions --help` for the full list.

# ----------------------------------------------------------------------------------
[model]
# ----------------------------------------------------------------------------------
language = yue
# None uses the language's own model: for yue, cantocaptions-cantonese-ASR. Or pick one:
# cantocaptions-cantonese-ASR  — fine-tuned for written Cantonese (recommended)
# Qwen3-ASR                    — stock 1.7B, output rewritten by the cleaning rules
# Qwen3-ASR-0.6B               — stock, smaller and weaker
# ...or any Whisper or wav2vec2-family CTC checkpoint, by hub id or path.
model = None
model_dir = None                 # where weights are cached; None = HF default
model_cache_only = False         # True never reaches the network (offline runs)

# ----------------------------------------------------------------------------------
[inference]
# ----------------------------------------------------------------------------------
# device is auto-detected (cuda > mps > cpu). Uncomment only to force one.
# A CUDA GPU is strongly recommended; CPU works but is far slower.
# device = cuda
device_index = 0
threads = 0                      # CPU threads; 0 lets torch decide

# The main VRAM lever. Lower it first if you run out of memory. The other stages' batch
# sizes are in their own sections: align_batch_size in [alignment] (the second-largest
# consumer) and vocal_isolation_batch_size in [vocal_isolation].
batch_size = 8                   # ASR segments per forward pass

asr_compute_type = default       # `default` picks float16 on cuda, float32 otherwise
attn_implementation = sdpa       # flash_attention_2 if you have it installed
compile = False                  # torch.compile: a net loss here, see pipeline/asr.py

# Your HuggingFace token, if a gated model needs one. Prefer the HF_TOKEN environment
# variable or --hf_token, so it never lands in a file you might commit.
# hf_token = None

# ----------------------------------------------------------------------------------
[output]
# ----------------------------------------------------------------------------------
output_dir = output
output_format = srt              # srt, vtt, json, tsv, txt, all
verbose = True
print_progress = True

vram_checks = False              # extra VRAM diagnostics in the log
vram_headroom_mb = 0             # MB to hold back from the allocator

# Debugging — per-stage checkpoints, so later stages can be re-run cheaply
debug_dir = None                 # set to a directory (e.g. `temp`) to save per-stage
                                 #   output there. Needed for load_debug_dir replay, but
                                 #   it writes the segmented WAVs too, so it grows large
load_debug_dir = None            # replay from a previous run's debug_dir

# ----------------------------------------------------------------------------------
[audio]
# ----------------------------------------------------------------------------------
audio_start = None               # seconds; trim the input to a clip
audio_end = None
audio_downmix = mix              # `center` takes the front-center channel alone, which
                                 #   on a 5.1 film soundtrack is largely the dialogue
audio_track = None               # 0-based stream; None picks one by --language from the tags
audio_normalize = True           # one linear gain to a fixed speech level, as trained

# ----------------------------------------------------------------------------------
[vad]
# Voice activity detection — finds the speech and cuts it into ASR-sized chunks
# ----------------------------------------------------------------------------------
vad_method = pyannote            # pyannote | silero (CPU; see the cpu preset)
# The thresholds below are calibrated for pyannote; silero's are in the cpu preset.
vad_onset = 0.15                 # lower = more sensitive, catches quieter speech
vad_offset = 0.15                # lower = holds a region open longer
vad_pad_onset = 0.25             # seconds kept BEFORE each region. The low onset
                                 #   threshold already fires early, so this stays small —
                                 #   raise it if lead-ins are being clipped
vad_pad_offset = 0.20            # ...and after, so word tails survive
vad_min_duration_off = 0.25      # silences shorter than this don't split a region
chunk_size = 28                  # max seconds per ASR chunk; also a VRAM lever

# ----------------------------------------------------------------------------------
[vocal_isolation]
# Strips music and effects before ASR. Slow, but helps on noisy audio
# ----------------------------------------------------------------------------------
vocal_isolation_method = none    # `mbroformer` to enable (downloads a ~600MB model)
vocal_isolation_segment_mode = chunked
vocal_isolation_batch_size = 4   # barely affects speed; little reason to change
vocal_isolation_compute_type = float32
vocal_isolation_compile = auto   # ~2x faster on CUDA once compiled; `auto` skips short runs
vocal_isolation_span_gap = 1.0   # isolate segments this close together as one stretch; 0 = off

# ----------------------------------------------------------------------------------
[ensemble]
# A second ASR opinion, and LLM correction. Rarely needed
# ----------------------------------------------------------------------------------
ensemble_model = none            # `whisper` adds a second opinion; slow
llm_correction = False           # not fully implemented; leave off
llm_model = Qwen/Qwen3-4B
llm_model_dir = None
# Reference subtitle — a same-content subtitle in another language, used as a hint by
# llm_correction and asr_context
reference_subtitle = None
reference_offset = 0.0           # constant shift applied to every reference cue
reference_correction_semantic = False

# ----------------------------------------------------------------------------------
[asr_context]
# Experimental: bias the ASR decode with the reference subtitle
# ----------------------------------------------------------------------------------
asr_context = False
asr_context_template = labelled  # none | bare | labelled | instruct
asr_context_scope = all          # all | expanded
asr_context_neighbours = 0
asr_context_max_chars = 400
asr_context_vad_expand = True
asr_context_padding = 0.5

# ----------------------------------------------------------------------------------
[alignment]
# Puts each character on the audio timeline
# ----------------------------------------------------------------------------------
no_align = False                 # True is much faster and much less accurate
align_model = None               # None = the language's (alvanlii/wav2vec2-BERT-cantonese)
interpolate_method = nearest
return_char_alignments = False
align_batch_size = 2             # the second-largest VRAM consumer, after batch_size
align_compute_type = float16     # float32 is slightly more accurate, ~2x the VRAM
align_char_substitution = None   # give the aligner a token for characters it has none
                                 #   for: off | variant | homophone | near. None = the align
                                 #   model's own (homophone for the Cantonese model)
align_substitutions = None       # your own TOML table, beats the automatic tiers
align_split_gap = None           # break a cue holding a silence this long, in seconds

# ----------------------------------------------------------------------------------
[cues]
# Cue timing and assembly
# ----------------------------------------------------------------------------------
align_padding = 0.04             # seconds of gap left between cues that would touch
align_release = 0.64             # how far a cue may extend into the following silence
align_merge_distance = 0.08      # gap below which neighbouring cues are joined
min_cue_duration = 0.5           # cues shorter than this are merged, dropped or held
max_cue_duration = 4.0           # cues longer than this are cut at a pause (0 = no cap)
merge_gap = 0.25                 # max silence a too-short cue may be merged across

# ----------------------------------------------------------------------------------
[subtitles]
# ----------------------------------------------------------------------------------
max_line_width = None            # characters per line; None = the language's (18 Chinese, 42 Latin); 0 = never break
max_line_count = 2               # lines per subtitle

# ----------------------------------------------------------------------------------
[cleaning]
# Text cleaning — written-Cantonese conventions, punctuation, numerals
# ----------------------------------------------------------------------------------
no_clean_text = False            # True leaves the model's raw text alone
clean_rules_dir = None           # your own rules (needs its own pipeline.toml)

# ----------------------------------------------------------------------------------
[diarization]
# Who is speaking. Stops one cue spanning two speakers
# ----------------------------------------------------------------------------------
diarize = False                  # True downloads a gated model; needs an HF token
diarize_model = pyannote/speaker-diarization-community-1
diarize_scope = segment          # `segment` per VAD chunk, `file` for the whole file
diarize_batch_size = 4           # 4 is the safe side of a VRAM cliff; see config.py
min_speakers = None
max_speakers = None
speaker_confidence = 0.7         # share one voice needs to claim a cue; lower = more splits
speaker_labels = False           # True prefixes subtitles with [SPEAKER_00]:
speaker_embeddings = False
speaker_conflict_share = 0.25
flag_speaker_conflicts = False

# ----------------------------------------------------------------------------------
[realign]
# Put an existing transcript or subtitle on THIS recording's timeline
# ----------------------------------------------------------------------------------
realign = None                   # path to a .txt transcript or an .srt; skips ASR
realign_mode = auto              # auto | transcript | sync | adjust
realign_anchor = acoustic        # acoustic needs no ASR pass and is more accurate
realign_normalize = True         # fold halfwidth punctuation to fullwidth first
realign_max_scale = 0.25         # bound on |speed - 1| the fit may use
realign_cut_policy = drop        # cues with no audio here: drop | keep
realign_adjust_tolerance = 2.0   # adjust: how far alignment may move a cue
realign_sync_anchor_density = 3.0  # sync: anchors per minute trusted directly
realign_window = 120.0           # seconds of audio each placement window sees
realign_commit_margin = 10.0
realign_min_score = 0.35         # diagnostic only; not a timing check
